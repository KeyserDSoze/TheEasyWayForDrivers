name: Build, test and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CODE_SIGNING_PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
      CODE_SIGNING_PASSWORD: ${{ secrets.CODE_SIGNING_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Compute version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tags = @(gh release list --limit 100 --json tagName --jq ".[].tagName")
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub releases non leggibili: nessuna versione generata."
          }
          # The recent release window no longer contains v0.0.1 after
          # more than 100 releases. Use MAX numeric SemVer, not presence
          # of the oldest tag, and fail closed on unknown version history.
          $version = & ./tools/Get-NextOmegaDriveVersion.ps1 -ReleaseTags $tags
          $tag = "v$version"

          # Fail BEFORE build/publish if an old Git tag already occupies
          # this version. Never delete or overwrite historical releases.
          git ls-remote --exit-code --tags origin "refs/tags/$tag" | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw "Tag $tag esistente: rilascio annullato senza sovrascrivere."
          }
          if ($LASTEXITCODE -ne 2) {
            throw "Impossibile verificare collisioni per $tag."
          }
          # git --exit-code returns 2 specifically for "no matching tag".
          # A successful absence check must not leave LASTEXITCODE=2 for
          # the PowerShell Action's final process exit status.
          $global:LASTEXITCODE = 0

          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify release version regression cases
        shell: pwsh
        run: ./tools/Test-ReleaseVersion.ps1

      - name: Verify release package gate regression cases
        shell: pwsh
        run: ./tools/Test-ReleasePackageChecks.ps1

      - name: Check Desktop/Service IPC contract
        shell: pwsh
        run: ./tools/Test-IpcCommandContract.ps1

      - name: Verify guided results UI structure
        shell: pwsh
        run: ./tools/Test-GuidedResultsUi.ps1

      - name: Verify OEM companion export contract
        shell: pwsh
        run: ./tools/Test-OemCompanionExport.ps1

      - name: Restore
        run: dotnet restore TheEasyWayForDrivers.slnx

      - name: Test
        run: dotnet test TheEasyWayForDrivers.slnx --configuration Release --no-restore

      - name: Prepare code-signing certificate
        if: env.CODE_SIGNING_PFX_BASE64 != '' && env.CODE_SIGNING_PASSWORD != ''
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "TheEasyWayForDrivers-CodeSigning.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:CODE_SIGNING_PFX_BASE64))
          "CODE_SIGNING_PFX=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish service
        shell: pwsh
        run: |
          dotnet publish src/App1.Service/App1.Service.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:Version="$env:VERSION" `
            --output artifacts/payload/Service

      - name: Publish desktop
        shell: pwsh
        run: |
          dotnet publish src/App2.Desktop/App2.Desktop.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version="$env:VERSION" `
            --output artifacts/payload/Desktop

      - name: Sign service and desktop
        if: env.CODE_SIGNING_PFX_BASE64 != '' && env.CODE_SIGNING_PASSWORD != ''
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signtool) {
            throw "signtool.exe was not found on the runner."
          }

          $targets = @(
            "artifacts/payload/Service/App1.Service.exe",
            "artifacts/payload/Desktop/App2.Desktop.exe"
          )

          foreach ($target in $targets) {
            & $signtool.FullName sign `
              /fd SHA256 `
              /td SHA256 `
              /tr "http://timestamp.digicert.com" `
              /f "$env:CODE_SIGNING_PFX" `
              /p "$env:CODE_SIGNING_PASSWORD" `
              "$target"

            if ($LASTEXITCODE -ne 0) {
              throw "Code signing failed for $target."
            }
          }

      - name: Verify signed service and desktop
        if: env.CODE_SIGNING_PFX_BASE64 != '' && env.CODE_SIGNING_PASSWORD != ''
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signtool) {
            throw "signtool.exe was not found on the runner."
          }

          foreach ($target in @(
            "artifacts/payload/Service/App1.Service.exe",
            "artifacts/payload/Desktop/App2.Desktop.exe"
          )) {
            & $signtool.FullName verify /pa /tw /v "$target"

            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode verification failed for $target."
            }
          }

      - name: Build embedded payload
        shell: pwsh
        run: |
          Compress-Archive `
            -Path artifacts/payload/* `
            -DestinationPath artifacts/payload.zip `
            -Force

      - name: Publish setup
        shell: pwsh
        run: |
          $payload = (Resolve-Path "artifacts/payload.zip").Path
          dotnet publish src/App3.Setup/App3.Setup.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:Version="$env:VERSION" `
            -p:PayloadZip="$payload" `
            --output artifacts/setup

          Move-Item `
            artifacts/setup/App3.Setup.exe `
            artifacts/OmegaDrive-Setup.exe

      - name: Sign setup
        if: env.CODE_SIGNING_PFX_BASE64 != '' && env.CODE_SIGNING_PASSWORD != ''
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signtool) {
            throw "signtool.exe was not found on the runner."
          }

          & $signtool.FullName sign `
            /fd SHA256 `
            /td SHA256 `
            /tr "http://timestamp.digicert.com" `
            /f "$env:CODE_SIGNING_PFX" `
            /p "$env:CODE_SIGNING_PASSWORD" `
            "artifacts/OmegaDrive-Setup.exe"

          if ($LASTEXITCODE -ne 0) {
            throw "Code signing failed for the setup executable."
          }

      - name: Verify signed setup
        if: env.CODE_SIGNING_PFX_BASE64 != '' && env.CODE_SIGNING_PASSWORD != ''
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signtool) {
            throw "signtool.exe was not found on the runner."
          }

          & $signtool.FullName verify /pa /tw /v "artifacts/OmegaDrive-Setup.exe"

          if ($LASTEXITCODE -ne 0) {
            throw "Authenticode verification failed for OmegaDrive-Setup.exe."
          }

      - name: Create legacy setup alias
        shell: pwsh
        run: |
          Copy-Item `
            "artifacts/OmegaDrive-Setup.exe" `
            "artifacts/TheEasyWayForDrivers-Setup.exe" `
            -Force

      - name: Generate SHA-256 files
        shell: pwsh
        run: |
          $hash = (Get-FileHash `
            "artifacts/OmegaDrive-Setup.exe" `
            -Algorithm SHA256).Hash.ToLowerInvariant()

          "$hash  OmegaDrive-Setup.exe" |
            Set-Content `
              "artifacts/OmegaDrive-Setup.exe.sha256" `
              -Encoding ascii

          "$hash  TheEasyWayForDrivers-Setup.exe" |
            Set-Content `
              "artifacts/TheEasyWayForDrivers-Setup.exe.sha256" `
              -Encoding ascii

      - name: Generate build manifest
        shell: pwsh
        run: |
          ./tools/New-OmegaDriveBuildManifest.ps1 `
            -Version "$env:VERSION" `
            -Commit "${{ github.sha }}" `
            -ServicePath "artifacts/payload/Service/App1.Service.exe" `
            -DesktopPath "artifacts/payload/Desktop/App2.Desktop.exe" `
            -SetupPath "artifacts/OmegaDrive-Setup.exe" `
            -LegacySetupPath "artifacts/TheEasyWayForDrivers-Setup.exe" `
            -OutputPath "artifacts/OmegaDrive-build-manifest.json"

      - name: Verify release package before publishing
        shell: pwsh
        run: ./tools/Test-ReleasePackage.ps1 -ArtifactsDirectory artifacts -ExpectedVersion "$env:VERSION" -ExpectedCommit "${{ github.sha }}"

      - name: Write release security summary
        shell: pwsh
        run: |
          $manifest = Get-Content "artifacts/OmegaDrive-build-manifest.json" -Raw |
            ConvertFrom-Json

          "## OmegaDrive release security" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "Version: **$($manifest.version)**" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "All Authenticode signatures valid: **$($manifest.allSignaturesValid)**" |
            Out-File $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "| Artifact | SHA-256 | Signature |" |
            Out-File $env:GITHUB_STEP_SUMMARY -Append
          "| --- | --- | --- |" |
            Out-File $env:GITHUB_STEP_SUMMARY -Append

          foreach ($artifact in $manifest.artifacts) {
            "| $($artifact.name) | `$($artifact.sha256)` | $($artifact.signatureStatus) |" |
              Out-File $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Historical releases are immutable. No cleanup-tag/delete
          # path is permitted in an automated publication workflow.
          gh release create "$env:TAG" `
            "artifacts/OmegaDrive-Setup.exe" `
            "artifacts/OmegaDrive-Setup.exe.sha256" `
            "artifacts/TheEasyWayForDrivers-Setup.exe" `
            "artifacts/TheEasyWayForDrivers-Setup.exe.sha256" `
            "artifacts/OmegaDrive-build-manifest.json" `
            "tools/Validate-OmegaDriveRuntime.ps1" `
            --title "OmegaDrive Driver Manager $env:VERSION" `
            --generate-notes `
            --latest
