name: Build, test and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CODE_SIGNING_PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
      CODE_SIGNING_PASSWORD: ${{ secrets.CODE_SIGNING_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Compute version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tags = @(gh release list --limit 100 --json tagName --jq ".[].tagName")
          if ($tags -notcontains "v0.0.1") {
            $version = "0.0.1"
          } else {
            $latestTag = gh release list --limit 1 --json tagName --jq ".[0].tagName"
            $parsed = [version]$latestTag.TrimStart('v', 'V')
            $version = "$($parsed.Major).$($parsed.Minor).$($parsed.Build + 1)"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore
        run: dotnet restore TheEasyWayForDrivers.slnx

      - name: Test
        run: dotnet test TheEasyWayForDrivers.slnx --configuration Release --no-restore

      - name: Prepare code-signing certificate
        if: env.CODE_SIGNING_PFX_BASE64 != '' && env.CODE_SIGNING_PASSWORD != ''
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "TheEasyWayForDrivers-CodeSigning.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:CODE_SIGNING_PFX_BASE64))
          "CODE_SIGNING_PFX=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish service
        shell: pwsh
        run: |
          dotnet publish src/App1.Service/App1.Service.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:Version="$env:VERSION" `
            --output artifacts/payload/Service

      - name: Publish desktop
        shell: pwsh
        run: |
          dotnet publish src/App2.Desktop/App2.Desktop.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version="$env:VERSION" `
            --output artifacts/payload/Desktop

      - name: Sign service and desktop
        if: env.CODE_SIGNING_PFX_BASE64 != '' && env.CODE_SIGNING_PASSWORD != ''
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signtool) {
            throw "signtool.exe was not found on the runner."
          }

          $targets = @(
            "artifacts/payload/Service/App1.Service.exe",
            "artifacts/payload/Desktop/App2.Desktop.exe"
          )

          foreach ($target in $targets) {
            & $signtool.FullName sign `
              /fd SHA256 `
              /td SHA256 `
              /tr "http://timestamp.digicert.com" `
              /f "$env:CODE_SIGNING_PFX" `
              /p "$env:CODE_SIGNING_PASSWORD" `
              "$target"

            if ($LASTEXITCODE -ne 0) {
              throw "Code signing failed for $target."
            }
          }

      - name: Build embedded payload
        shell: pwsh
        run: |
          Compress-Archive `
            -Path artifacts/payload/* `
            -DestinationPath artifacts/payload.zip `
            -Force

      - name: Publish setup
        shell: pwsh
        run: |
          $payload = (Resolve-Path "artifacts/payload.zip").Path
          dotnet publish src/App3.Setup/App3.Setup.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:Version="$env:VERSION" `
            -p:PayloadZip="$payload" `
            --output artifacts/setup

          Move-Item `
            artifacts/setup/App3.Setup.exe `
            artifacts/TheEasyWayForDrivers-Setup.exe

      - name: Sign setup
        if: env.CODE_SIGNING_PFX_BASE64 != '' && env.CODE_SIGNING_PASSWORD != ''
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signtool) {
            throw "signtool.exe was not found on the runner."
          }

          & $signtool.FullName sign `
            /fd SHA256 `
            /td SHA256 `
            /tr "http://timestamp.digicert.com" `
            /f "$env:CODE_SIGNING_PFX" `
            /p "$env:CODE_SIGNING_PASSWORD" `
            "artifacts/TheEasyWayForDrivers-Setup.exe"

          if ($LASTEXITCODE -ne 0) {
            throw "Code signing failed for the setup executable."
          }

      - name: Generate SHA-256 file
        shell: pwsh
        run: |
          $hash = (Get-FileHash `
            "artifacts/TheEasyWayForDrivers-Setup.exe" `
            -Algorithm SHA256).Hash.ToLowerInvariant()

          "$hash  TheEasyWayForDrivers-Setup.exe" |
            Set-Content `
              "artifacts/TheEasyWayForDrivers-Setup.exe.sha256" `
              -Encoding ascii

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:VERSION -eq "0.0.1") {
            $tags = @(gh release list --limit 100 --json tagName --jq ".[].tagName")
            if ($tags -contains "v0.0.2") {
              gh release delete v0.0.2 --cleanup-tag --yes
            }
          }

          gh release create "$env:TAG" `
            "artifacts/TheEasyWayForDrivers-Setup.exe" `
            "artifacts/TheEasyWayForDrivers-Setup.exe.sha256" `
            --title "TheEasyWayForDrivers $env:VERSION" `
            --generate-notes `
            --latest
